# T02 | Ejemplo de configuración válida del contrato v1 (docs/contratos.md).
# Pares clave: valor planos; las banderas de la CLI tienen prioridad sobre este archivo.
# Valores de ejemplo con parámetros sintéticos: no son parámetros calibrados ni resultados.
estacion: sintetica
regimen: normal            # etiqueta: normal | el_nino
config_id: 0               # c en el índice global i = c*N + j
semilla: 20261015          # entero de 64 bits sin signo
n: 1000000                 # N escenarios de esta configuración
dias: 120                  # D, días de la temporada
p01: 0.15                  # P(lluvia hoy | ayer seco)
p11: 0.60                  # P(lluvia hoy | ayer lluvioso)
alfa: 0.7                  # forma de la gamma
theta: 9.0                 # escala de la gamma, mm
capacidad: 6               # C, mm/día
umbral: 50                 # U, mm
hilos: 1                   # solo OpenMP
lote: 62500                # solo pp_mpi_dinamico
salida: results/raw/ejemplo.csv
